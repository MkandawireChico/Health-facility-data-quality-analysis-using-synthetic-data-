name: Project quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q src dashboard
      - name: Validate notebook code cells
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          notebook = json.loads(Path("notebooks/health_data_quality_analysis.ipynb").read_text())
          for index, cell in enumerate(notebook["cells"]):
              if cell.get("cell_type") == "code":
                  ast.parse("".join(cell.get("source", [])), filename=f"notebook-cell-{index}")
          print("Notebook JSON and code cells are valid.")
          PY
      - name: Run data-quality tests
        run: pytest -q
